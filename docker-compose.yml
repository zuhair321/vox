services:
  postgres:
    image: postgres:17-bookworm
    container_name: vox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vox
      POSTGRES_PASSWORD: vox
      POSTGRES_DB: vox_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vox-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vox -d vox_dev"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  vox-postgres-data:
