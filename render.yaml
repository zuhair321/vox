# VOX - All Free Tier Deploy
# Note: Render no longer offers free Redis. Use Upstash (free tier) instead.
# Sign up at https://upstash.com and get REDIS_URL

services:
  - type: web
    name: vox-backend
    runtime: node
    plan: free
    autoDeploy: true
    branch: master
    buildCommand: cd backend && npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vox-db
          property: connectionString
      - key: DATABASE_CONNECTION_LIMIT
        value: 10
      - key: PORT
        value: 4000
      - key: CLIENT_ORIGIN
        value: https://vox-frontend.onrender.com
      - key: EXTRA_CORS_ORIGINS
        value: https://vox-frontend.onrender.com
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: TWO_FACTOR_APP_NAME
        value: VOX
      - key: TWO_FACTOR_ENCRYPTION_KEY
        generateValue: true
      # IMPORTANT: Redis no longer free on Render. Use Upstash free tier instead:
      # Sign up at https://upstash.com, create Redis, paste URL here:
      - key: REDIS_URL
        sync: false
      - key: REDIS_CACHE_TTL
        value: 60
      - key: RESEND_API_KEY
        value: dev
      - key: RESEND_FROM_ADDRESS
        value: VOX <noreply@vox.app>

  - type: static
    name: vox-frontend
    plan: free
    autoDeploy: true
    branch: master
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://vox-backend.onrender.com

databases:
  - name: vox-db
    plan: free
    databaseName: vox_dev
    user: vox
