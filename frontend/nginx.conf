# VOX frontend (React SPA) — Nginx config.
# Served as static assets with client-side routing fallback, and proxies
# /api and /socket.io to the backend so the browser only needs one origin.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Cache hashed static assets aggressively; revalidate on change.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Proxy API + WebSocket traffic to the backend.
  # Set VITE_API_BASE-less deployments to use the same host:port.
  location /api/ {
    proxy_pass         http://vox-backend:4000;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass         http://vox-backend:4000;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
  }

  # SPA fallback: any non-file route returns index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Don't serve hidden files.
  location ~ /\. {
    deny all;
  }
}
