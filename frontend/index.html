<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOX - Dark Matter Protocol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel+Decorative:wght@400;700;900&family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // ── SW reset: kill any stale service worker + clear its caches ──
      // Runs once per session. The previous SW was cache-first for HTML
      // and could lock the page onto an old bundle. This forces a clean slate.
      if ('serviceWorker' in navigator && !sessionStorage.getItem('vox-sw-killed')) {
        sessionStorage.setItem('vox-sw-killed', '1');
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
          // Only reload if there were actually SWs to clean up.
          if (regs.length > 0 && window.caches) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) { caches.delete(k); });
            });
            window.location.reload();
          }
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
